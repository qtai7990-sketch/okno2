name: Обязательная проверка (gate)

# Запускается на КАЖДОМ pull request и на main, без фильтра путей — её и делать обязательной в защите ветки.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Инструменты (только по хэшам)
        run: pip install --require-hashes --no-deps -r server/requirements-dev.lock
      - name: Проверка workflow (actionlint)
        run: actionlint -color
      - name: Настройки развёртывания
        run: python3 tools/ci_check_deploy.py
      - name: Зависимости Android зафиксированы
        run: |
          for f in android/gradle/verification-metadata.xml android/app/gradle.lockfile; do
            [ -s "$f" ] || { echo "Нет $f — запустите workflow «Фиксация зависимостей Android» и добавьте файлы в репозиторий"; exit 1; }
          done
