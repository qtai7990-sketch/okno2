name: Проверка сервера

on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", "tools/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "web/**", "tools/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Зависимости (только по хэшам)
        run: pip install --require-hashes --no-deps -r server/requirements-dev.lock
      - name: Известные уязвимости
        run: pip-audit --require-hashes --strict -r server/requirements.lock
      - name: Тесты
        working-directory: server
        run: python -m pytest -q
      - name: Миграции совпадают со схемой
        working-directory: server
        env:
          SIMPAD_DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check
      - name: Настройки развёртывания (digest образов, mTLS, закрытая сеть)
        run: python3 tools/ci_check_deploy.py
      - name: SBOM сервера
        run: pip-audit --require-hashes -r server/requirements.lock --format cyclonedx-json -o sbom-server.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-server
          path: sbom-server.cdx.json
          retention-days: 90
