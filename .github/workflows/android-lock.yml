name: Фиксация зависимостей Android (запускать вручную)

# Один раз (и при каждом изменении библиотек): создаёт android/app/gradle.lockfile и
# android/gradle/verification-metadata.xml. Результат проверяется человеком и добавляется в репозиторий
# через pull request. Сборка с одноразовым ключом нужна только чтобы учесть все библиотеки рабочей сборки;
# сам APK выбрасывается.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Фиксация версий и контрольных сумм
        working-directory: android
        env:
          SIMPAD_SERVER_URL: https://lock.invalid.example
          SIMPAD_CERT_PINS: C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=,diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI=
        run: |
          chmod +x gradlew
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias t -keyalg RSA -keysize 2048 -validity 1 \
            -storepass throwaway -keypass throwaway -dname "CN=throwaway" >/dev/null
          export SIMPAD_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.jks" SIMPAD_KEYSTORE_PASSWORD=throwaway SIMPAD_KEY_ALIAS=t SIMPAD_KEY_PASSWORD=throwaway
          ./gradlew --no-daemon :app:dependencies --write-locks > /dev/null
          ./gradlew --no-daemon --write-verification-metadata sha256 assembleDemoDebug assembleProdRelease
          rm -f "$RUNNER_TEMP/throwaway.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-dependency-locks
          path: |
            android/app/gradle.lockfile
            android/gradle/verification-metadata.xml
          retention-days: 14
