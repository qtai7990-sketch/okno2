name: Учебная сборка планшета (TRAINING)

# Только учебная сборка (демо-сканер, адрес сервера вводится вручную). Для реальных клиентов НЕ использовать.
on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android-*.yml"]
  pull_request:
    paths: ["android/**", "web/**", ".github/workflows/android-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Зависимости зафиксированы (без них сборка запрещена)
        run: |
          for f in android/gradle/verification-metadata.xml android/app/gradle.lockfile; do
            [ -s "$f" ] || { echo "Нет $f — запустите «Фиксация зависимостей Android»"; exit 1; }
          done
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Учебная сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDemoDebug   # загрузка через веб-интерфейс GitHub не сохраняет права на запуск
      - name: Контрольные суммы
        run: |
          mkdir out
          cp android/app/build/outputs/apk/demo/debug/*.apk out/OKNO-TRAINING-demo.apk
          (cd out && sha256sum -- *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OKNO-TRAINING-only-demo-apk
          path: out/
          retention-days: 14
