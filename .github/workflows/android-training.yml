name: Учебная сборка планшета (TRAINING)

# Только учебная сборка (демо-сканер, адрес сервера вводится вручную). Для реальных клиентов НЕ использовать.
on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android-*.yml"]
  pull_request:
    paths: ["android/**", "web/**", ".github/workflows/android-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Зависимости зафиксированы (без них сборка запрещена)
        run: |
          for f in android/gradle/verification-metadata.xml android/app/gradle.lockfile; do
            [ -s "$f" ] || { echo "Нет $f — запустите «Фиксация зависимостей Android»"; exit 1; }
          done
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Учебная сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDemoDebug   # загрузка через веб-интерфейс GitHub не сохраняет права на запуск
      - name: Контрольные суммы
        run: |
          mkdir out
          cp android/app/build/outputs/apk/demo/debug/*.apk out/OKNO-TRAINING-demo.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OKNO-TRAINING-only-demo-apk
          path: out/
          retention-days: 14
