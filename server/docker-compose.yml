# Рабочий сервер:  docker compose --env-file .env up -d        (образ API — из выпуска GitHub, по digest, SIMPAD_API_IMAGE)
# Учебный сервер:  docker compose --env-file .env -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Образы закреплены по контрольной сумме (digest). Обновление — только осознанной правкой этого файла.
services:
  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpad
      POSTGRES_USER: simpad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpad -d simpad"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  api:
    # подписанный образ из выпуска GitHub: ghcr.io/<организация>/simpad-api@sha256:<digest> (tools/update.sh)
    image: ${SIMPAD_API_IMAGE:?не задан SIMPAD_API_IMAGE}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      SIMPAD_DATABASE_URL: postgresql+psycopg://simpad:${POSTGRES_PASSWORD}@db:5432/simpad
      SIMPAD_DATA_KEY: ${SIMPAD_DATA_KEY}
      SIMPAD_DUP_KEY: ${SIMPAD_DUP_KEY}
      SIMPAD_ADMIN_TOKEN: ${SIMPAD_ADMIN_TOKEN}
      SIMPAD_TZ: Europe/Moscow
      SIMPAD_ALLOW_DEMO_SCAN: ${SIMPAD_ALLOW_DEMO_SCAN:-false}
      SIMPAD_BANK_MTLS: ${SIMPAD_BANK_MTLS:-true}
      SIMPAD_MIN_APP_VERSION: ${SIMPAD_MIN_APP_VERSION:-0}
    # порты наружу не открываются; сеть private — внутренняя, без выхода в интернет
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    logging: *logs

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./bank-ca.pem:/etc/caddy/bank-ca.pem:ro
      - caddy_data:/data
    environment:
      SIMPAD_DOMAIN: ${SIMPAD_DOMAIN}
      SIMPAD_BANK_DOMAIN: ${SIMPAD_BANK_DOMAIN}
      SIMPAD_BANK_IPS: ${SIMPAD_BANK_IPS}
      SIMPAD_ADMIN_IPS: ${SIMPAD_ADMIN_IPS}
    # edge — выход в интернет (сертификаты Let's Encrypt), private — связь с api
    networks: [edge, private]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logs

networks:
  edge: {}
  private:
    internal: true

volumes:
  pgdata:
  caddy_data:
